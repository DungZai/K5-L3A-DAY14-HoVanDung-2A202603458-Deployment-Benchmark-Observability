services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore # Match the region of the existing Render Key Value instance.
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false # Set to the existing Key Value instance's Internal URL in Render.
