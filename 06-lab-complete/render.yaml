services:
  - type: web
    name: day14-agent-oregon
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-deployment
          property: connectionString
